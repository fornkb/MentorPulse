{{ form.non_field_errors }}
{% for field in form %}
<div class="mb-3">
    {% if field.field.widget.input_type == 'checkbox' %}
        <label class="d-flex align-items-center gap-2">{{ field }} {{ field.label }}</label>
    {% else %}
        <label for="{{ field.id_for_label }}" class="mp-form-label">{{ field.label }}{% if field.field.required %} <span aria-label="required">*</span>{% endif %}</label>
        {{ field }}
    {% endif %}
    {% if field.help_text %}<div class="mp-form-help">{{ field.help_text|safe }}</div>{% endif %}
    {% for error in field.errors %}<div class="text-danger small" role="alert">{{ error }}</div>{% endfor %}
</div>
{% endfor %}
